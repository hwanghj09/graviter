<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graviter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-root">
<canvas id="game-canvas" width="960" height="600"></canvas>
</div>

<!-- UI_SCREENS_START -->
<div id="main-menu" class="screen">
  <canvas id="menu-bg-canvas"></canvas>
  <div class="screen-panel main-menu-panel">
    <h1>Graviter</h1>
    <button id="btn-start" type="button">시작하기</button>
    <button id="btn-settings" type="button">설정</button>
  </div>
</div>

<div id="stage-select" class="screen stage-select-screen">
  <div class="screen-panel stage-select-panel">
    <h2>스테이지 선택</h2>
    <div id="stage-grid" class="stage-grid"></div>
    <nav id="stage-pagination" class="stage-pagination" aria-label="스테이지 페이지" hidden>
      <button id="stage-page-prev" type="button">이전</button>
      <span id="stage-page-label" class="stage-page-label" aria-live="polite"></span>
      <button id="stage-page-next" type="button">다음</button>
    </nav>
    <div class="stage-select-actions">
      <button id="stage-select-back" type="button">뒤로</button>
    </div>
  </div>
</div>

<div id="settings" class="screen">
  <div class="screen-panel settings-panel">
    <h2>설정</h2>
    <button id="settings-open-controls" type="button">조작 설정</button>
    <button id="settings-open-sound" type="button">사운드 설정</button>
    <button id="settings-back" type="button">뒤로</button>
  </div>
</div>

<div id="settings-controls" class="screen">
  <div class="screen-panel settings-panel">
    <h2>조작 설정</h2>
    <div class="settings-section">
      <div class="keybind-row"><span>왼쪽</span><button id="keybind-left" class="keybind-btn" type="button" data-action="left" aria-label="왼쪽 이동 키 변경"></button></div>
      <div class="keybind-row"><span>오른쪽</span><button id="keybind-right" class="keybind-btn" type="button" data-action="right" aria-label="오른쪽 이동 키 변경"></button></div>
      <div class="keybind-row"><span>점프</span><button id="keybind-jump" class="keybind-btn" type="button" data-action="jump" aria-label="점프 키 변경"></button></div>
      <div class="keybind-row"><span>웅크리기</span><button id="keybind-crouch" class="keybind-btn" type="button" data-action="crouch" aria-label="웅크리기 키 변경"></button></div>
      <div class="keybind-row"><span>중력 회전</span><button id="keybind-rotate" class="keybind-btn" type="button" data-action="rotate" aria-label="중력 회전 키 변경"></button></div>
      <div class="keybind-row"><span>블럭 잡기</span><button id="keybind-grab" class="keybind-btn" type="button" data-action="grab" aria-label="블럭 잡기 키 변경"></button></div>
      <div id="keybind-warning" class="keybind-warning" role="alert" hidden></div>
    </div>
    <button id="settings-controls-back" type="button">뒤로</button>
  </div>
</div>

<div id="settings-sound" class="screen">
  <div class="screen-panel settings-panel">
    <h2>사운드 설정</h2>
    <div class="settings-section">
      <div class="volume-row"><span>마스터</span><input type="range" class="volume-slider" id="volume-master" min="0" max="1" step="0.01" aria-label="마스터 볼륨"></div>
      <div class="volume-row"><span>배경음악</span><input type="range" class="volume-slider" id="volume-music" min="0" max="1" step="0.01" aria-label="배경음악 볼륨"></div>
      <div class="volume-row"><span>효과음</span><input type="range" class="volume-slider" id="volume-effects" min="0" max="1" step="0.01" aria-label="효과음 볼륨"></div>
      <div class="volume-row"><span>상호작용</span><input type="range" class="volume-slider" id="volume-interaction" min="0" max="1" step="0.01" aria-label="상호작용 사운드 볼륨"></div>
    </div>
    <button id="settings-sound-back" type="button">뒤로</button>
  </div>
</div>

<div id="pause-menu" class="screen screen-overlay">
  <div class="screen-panel">
    <h2>일시정지</h2>
    <button id="pause-resume" type="button">계속하기</button>
    <button id="pause-settings" type="button">설정</button>
    <button id="pause-exit" type="button">나가기</button>
  </div>
</div>

<div id="stage-clear" class="screen screen-overlay">
  <div class="screen-panel clear-panel">
    <h2>스테이지 클리어!</h2>
  </div>
</div>

<div id="ending" class="screen">
  <div class="screen-panel ending-panel">
    <h2>축하합니다!</h2>
    <p>모든 스테이지를 클리어했습니다.</p>
    <button id="ending-menu" type="button">메인 화면으로</button>
  </div>
</div>
<!-- UI_SCREENS_END -->

<script src="js/engine/gravity.js"></script>
<script src="js/engine/grid.js"></script>
<script src="js/state/storage.js"></script>
<script src="js/audio/audio.js"></script>
<script src="js/input/input.js"></script>
<script src="js/engine/player.js"></script>
<script src="js/engine/block.js"></script>
<script src="js/engine/coin.js"></script>
<script src="js/engine/physics.js"></script>
<script src="js/render/camera.js"></script>
<script src="js/render/renderer.js"></script>
<script src="js/state/gameState.js"></script>

<!-- STAGE_SCRIPTS_START -->
<script src="js/stages/puzzleStage.js"></script>
<script src="js/stages/stage01.js"></script>
<script src="js/stages/stage02.js"></script>
<script src="js/stages/stage03.js"></script>
<script src="js/stages/stage04.js"></script>
<script src="js/stages/stage05.js"></script>
<script src="js/stages/stage06.js"></script>
<script src="js/stages/stage07.js"></script>
<script src="js/stages/stage08.js"></script>
<script src="js/stages/stage09.js"></script>
<script src="js/stages/stage10.js"></script>
<!-- STAGE_SCRIPTS_END -->

<!-- UI_SCRIPTS_START -->
<script src="js/ui/menuBackground.js"></script>
<script src="js/ui/mainMenu.js"></script>
<script src="js/ui/stageSelect.js"></script>
<script src="js/ui/settingsMenu.js"></script>
<script src="js/ui/pauseMenu.js"></script>
<script src="js/ui/stageClear.js"></script>
<script src="js/ui/ending.js"></script>
<script src="js/ui/bootstrap.js"></script>
<!-- UI_SCRIPTS_END -->

<script src="js/main.js"></script>
</body>
</html>
